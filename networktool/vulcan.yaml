name: networktool
display: Network Tools
summary: Network Tools for Debugging
images:
  - harbor.cesiworks.com/docker.io/wbitt/network-multitool:extra
long-description: |
  Once Running use the following to get a terminal: 
  - kubectl exec -n networktool -it network-tool -- sh -c bash
  
  Tools included:
  - apk package manager
  - Nginx Web Server (port 80, port 443) - with customizable ports!
  - awk, cut, diff, find, grep, sed, vi editor, wc
  - curl, wget
  - dig, nslookup
  - ip, ifconfig, route
  - traceroute, tracepath, mtr, tcptraceroute (for layer 4 packet tracing)
  - ping, arp, arping
  - ps, netstat
  - gzip, cpio, tar
  - telnet client
  - tcpdump
  - jq
  - iperf3
  - ethtool, mii-tool, route
  - nmap
  - ss
  - tshark
  - ssh client, lftp client, rsync, scp
  - netcat (nc), socat
  - ApacheBench (ab)
  - mysql & postgresql client
  - git
    
