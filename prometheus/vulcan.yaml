name: Prometheus
description: |
  Prometheus is an open-source systems monitoring and alerting toolkit designed for reliability and scalability. It 
  collects metrics from applications and infrastructure, stores them in a time-series database, and allows powerful 
  querying and visualization. Often paired with Grafana, it’s widely used for observing cloud-native and Kubernetes 
  environments.
images:
  - quay.io/prometheus/node-exporter:v1.7.0
  - quay.io/prometheus-operator/prometheus-config-reloader:v0.71.2
  - quay.io/prometheus-operator/prometheus-operator:v0.71.2
  - quay.io/prometheus/prometheus:v2.49.1
scripts:
  pre-install: pre-install.sh
