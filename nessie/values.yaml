# Sample values.yaml for Nessie with Postgres + MinIO

# Number of ingress / exposure settings, replicas etc
replicaCount: 2   # or more, depending on HA needs

# ---- Version store / metadata persistence via Postgres ----
versionStoreType: JDBC   # Use JDBC for Postgres
jdbc:
  jdbcUrl: "jdbc:postgresql://clio-db-rw:5432/clio"
  # If using a schema, ensure currentSchema is included
  # If your Postgres instance supports multiple schemas, the schema can be set here
  secret:
    name: app-user-creds
    username: username         # e.g. "nessie"
    password: password     # this can be literal or fetched via a k8s secret

# ---- Object Store / S3 / MinIO configuration ----
storage:
  s3:
    # Optional: check chart version if this is under `storage`, or maybe under `catalog.storage.s3`
    enabled: true
    defaultOptions:
      endpoint: "http://clio-minio-hl:9000"
      region: "us-east-1"               # can be a dummy or real region
      pathStyleAccess: true            # important for MinIO
    authType: STATIC                   # or whatever method chart supports
    accessKeySecret:
      name: storage-user
      key: CONSOLE_ACCESS_KEY
    secretKeySecret:
      name: storage-user
      key: CONSOLE_SECRET_KEY

# ---- Warehouses / Iceberg catalog configuration ----
catalog:
  enabled: true
  iceberg:
    defaultWarehouse: "defaultWarehouse"   # a name you pick
    warehouses:
      - name: "defaultWarehouse"
        location: "s3://clio-data-lakehouse/iceberg-warehouse"   # MinIO bucket/path
        # Optionally more override/default options per warehouse

# ---- Resource sizing etc ----
resources:
  requests:
    cpu: "500m"
    memory: "2Gi"
  limits:
    cpu: "1"
    memory: "4Gi"

# ---- Database / Secret / Postgres external ----
postgresql:
  enabled: false   # because you're using an external Postgres
#externalDatabase:
#  host: your-postgres-host
#  port: 5432
#  user: <your-db-user>
#  database: nessiedb
#  existingSecret: nessie-postgres-secret  # if you have secret for user/password

# ---- Secrets ----
#secrets:
#  # name of the secret that has MinIO creds
#  minio:
#    name: nessie-minio-secret
#  # Postgres secret as above

# ---- Additional / Advanced config overrides ----
advancedConfig: {}   # you can supply arbitrary Nessie / Quarkus properties here if you need tweaks
# e.g.
# advancedConfig:
#   quarkus.http.host: 0.0.0.0
#   nessie.version.store.persist.jdbc.schema: nessie

# ---- Ingress / Service config etc ----
service:
  type: ClusterIP
  port: 19120

ingress:
  enabled: false
  hosts:
    - host: nessie.local.kube
      paths:
        - path: /
          pathType: Prefix
