name: vulcan
description: A Remote Development Catalog for Common Applications
components:
  - name: grafana
    summary: Metrics Visualization Tool
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: grafana
  - name: prometheus
    summary: Prometheus Operator and Instance
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: prometheus
  - name: nginx
    summary: NGINX Ingress Controller
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: nginx
  - name: minio
    summary: MinIO Operator
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: minio
  - name: cnpg
    summary: CNPG (Cloud Native Postgres) Operator
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: cnpg
  - name: sso
    summary: Keycloak used for SSO
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
