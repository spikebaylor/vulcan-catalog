name: dev-catalog
components:
  - name: grafana
    description: |
      Grafana is an open-source visualization and analytics platform for monitoring time-series data from sources like 
      Prometheus, InfluxDB, and Elasticsearch. It enables users to create interactive dashboards and alerts for observing 
      system and application metrics.
    type: git
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: grafana
  - name: nginx
    description: |
      NGINX Ingress Controller
    type: git
