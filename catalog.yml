name: vulcan-catalog
components:
  - name: grafana
    description: |
      Grafana is an open-source visualization and analytics platform for monitoring time-series data from sources like 
      Prometheus, InfluxDB, and Elasticsearch. It enables users to create interactive dashboards and alerts for observing 
      system and application metrics.
    type: git
    attributes:
      repo: git@github.com:spikebaylor/vulcan-catalog.git
      branch: main
      path: grafana
  - name: nginx
    description: |
      NGINX Ingress Controller
    type: git
    attributes:
      repo: git@github.com:spikebaylor/vulcan-catalog.git
      branch: main
      path: nginx
  - name: minio
    description: |
      Minio Operator
    type: git
    attributes:
      repo: git@github.com:spikebaylor/vulcan-catalog.git
      branch: main
      path: minio
  - name: cnpg
    description: |
      CNPG Operator
    type: git
    attributes:
      repo: git@github.com:spikebaylor/vulcan-catalog.git
      branch: main
      path: cnpg
  - name: prometheus
    description: |
      Prometheus operator, instance and node exporter.
    type: git
    attributes:
      repo: git@github.com:spikebaylor/vulcan-catalog.git
      branch: main
      path: prometheus
