      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: mongo
  - name: networktool
    summary: Network Tools for Debugging
    type: localpath
    attributes:
      repo: https://github.com/spikebaylor/vulcan-catalog.git
      branch: main
      rootPath: networktool
  - name: portainer
    summary: Portainer
    type: localpath
