name: chaos
display: Chaos Mesh
long-description: |
  Chaos Mesh brings various types of fault simulation to Kubernetes and has an enormous capability to orchestrate fault 
  scenarios. It helps you conveniently simulate various abnormalities that might occur in reality during the 
  development, testing, and production environments and find potential problems in the system.
  
  See https://chaos-mesh.org/ for more information
